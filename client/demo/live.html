<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EkoLite live demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .lede {
        color: #555;
        margin-top: 0;
      }
      #status {
        font-weight: 600;
        padding: 0.4rem 0.6rem;
        background: #eef;
        border-radius: 0.4rem;
        display: inline-block;
      }
      ul {
        padding-left: 1.2rem;
      }
      li {
        padding: 0.15rem 0;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        color: #444;
        background: #f6f6f6;
        border-radius: 0.4rem;
        padding: 0.6rem;
        max-height: 12rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>EkoLite live demo</h1>
      <p class="lede">
        The real ConnectionManager and ReactiveStore, talking to a live server at
        ws://localhost:3001/ws. The files list streams from Mongo. Start the server with
        npm run dev:server first.
      </p>
      <p id="status">connecting…</p>

      <h2>files</h2>
      <ul id="list"></ul>

      <h2>messages</h2>
      <div id="log"></div>
    </main>
    <script type="module" src="./live.ts"></script>
  </body>
</html>
